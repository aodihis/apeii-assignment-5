name: apeii-5

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: apeii5
      POSTGRES_PASSWORD: apeii5
      POSTGRES_DB: apeii5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  qdrant_data:
  pgdata:
